# ============================================================
# MD Blog 一键启动编排：MySQL + 后端(Egg.js) + 前端(Nginx)
# ------------------------------------------------------------
# 快速开始：
#   cp .env.example .env        # 按需修改数据库密码 / 端口 / LLM Key
#   docker compose up -d --build
# 访问：http://localhost:8080   （默认前端端口，见 .env 的 WEB_PORT）
# ============================================================

services:
  # ---------------- MySQL 数据库 ----------------
  db:
    image: mysql:8.0
    container_name: md-blog-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_NAME:-md_me_blog}
      TZ: Asia/Shanghai
    volumes:
      - db-data:/var/lib/mysql
      # 数据卷为空（首次启动）时自动建表并写入初始数据
      - ./database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # 仅调试用（如 Navicat 连接）；默认映射到本机 3307，避免与本机已有 MySQL 冲突。
      # 不需要外部访问可整段删除。
      - "${DB_EXPOSE_PORT:-3307}:3306"
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - md-blog

  # ---------------- 后端 Egg.js ----------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: md-blog-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      EGG_SERVER_ENV: prod
      EGG_WORKERS: ${EGG_WORKERS:-1}
      PORT: 7001
      TZ: Asia/Shanghai
      # 数据库（host 使用 compose 服务名 db）
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-md_me_blog}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      # 安全密钥（生产务必修改）
      APP_KEYS: ${APP_KEYS:-}
      JWT_SECRET: ${JWT_SECRET:-}
      # AI 智能客服（智谱 GLM）；留空则对话不可用，其余功能正常
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      LLM_MODEL: ${LLM_MODEL:-glm-4-flash}
    expose:
      - "7001"
    networks:
      - md-blog

  # ---------------- 前端 Nginx ----------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: md-blog-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - md-blog

volumes:
  db-data:
    name: md-blog-db-data

networks:
  md-blog:
    name: md-blog-net
    driver: bridge

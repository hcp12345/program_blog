server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---------------- gzip ----------------
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # ---------------- 静态资源 ----------------
    # Vite 产物带内容 hash，可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------------- 后端 API 反向代理 ----------------
    location /api/ {
        proxy_pass http://backend:7001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # AI 智能客服使用 SSE 流式返回，必须关闭缓冲，否则前端收不到实时内容
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------------- 健康检查透传 ----------------
    location = /health {
        proxy_pass http://backend:7001/health;
        proxy_set_header Host $host;
    }

    # ---------------- SPA 前端路由回退 ----------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
